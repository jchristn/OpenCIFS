name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore src/OpenCIFS.sln

      - name: Build
        run: dotnet build src/OpenCIFS.sln --configuration Release --no-restore

      - name: Run Touchstone Console Suites
        shell: pwsh
        run: ./eng/run-touchstone.ps1 -Configuration Release

      - name: Run Framework Test Projects
        run: dotnet test src/OpenCIFS.sln --configuration Release --no-build
